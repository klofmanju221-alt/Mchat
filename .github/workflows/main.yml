name: Build Mchat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Configuring Android compile SDK"
          echo "========================================"

          python3 - <<'PY'
          from pathlib import Path
          import re

          # -------------------------------------------------
          # 1. Set Mchat app compileSdk to 37
          # -------------------------------------------------
          app = Path("android/app/build.gradle.kts")

          if app.exists():
              text = app.read_text()

              text = re.sub(
                  r'compileSdk\s*=\s*\d+',
                  'compileSdk = 37',
                  text
              )

              app.write_text(text)
              print("Mchat app compileSdk = 37")
          else:
              print("ERROR: android/app/build.gradle.kts not found")
              raise SystemExit(1)

          # -------------------------------------------------
          # 2. Find the REAL Agora plugin
          #    Do NOT modify the example project.
          # -------------------------------------------------
          pub = Path.home() / ".pub-cache" / "hosted" / "pub.dev"

          agora_dirs = sorted(
              pub.glob("agora_rtc_engine-*/android")
          )

          agora_dirs = [
              p for p in agora_dirs
              if "/example/" not in str(p)
          ]

          if not agora_dirs:
              print("ERROR: Real agora_rtc_engine Android folder not found")
              raise SystemExit(1)

          print("")
          print("Agora Android folders found:")

          for p in agora_dirs:
              print(" -", p)

          # -------------------------------------------------
          # 3. Modify the REAL Agora Gradle file
          # -------------------------------------------------
          for android_dir in agora_dirs:
              gradle_files = [
                  android_dir / "build.gradle",
                  android_dir / "build.gradle.kts",
              ]

              for gradle in gradle_files:
                  if not gradle.exists():
                      continue

                  text = gradle.read_text()
                  original = text

                  # Old syntax
                  text = re.sub(
                      r'compileSdkVersion\s+\d+',
                      'compileSdkVersion 37',
                      text
                  )

                  # Kotlin DSL
                  text = re.sub(
                      r'compileSdk\s*=\s*\d+',
                      'compileSdk = 37',
                      text
                  )

                  # Other syntax
                  text = re.sub(
                      r'compileSdk\s+\d+',
                      'compileSdk 37',
                      text
                  )

                  # If Agora does not explicitly define compileSdk,
                  # add it inside android { }.
                  if "compileSdk" not in text:
                      match = re.search(
                          r'android\s*\{',
                          text
                      )

                      if match:
                          position = match.end()
                          text = (
                              text[:position]
                              + "\n    compileSdkVersion 37\n"
                              + text[position:]
                          )

                  gradle.write_text(text)

                  print("")
                  print("Updated Agora Gradle:")
                  print(gradle)

                  print("--- compileSdk lines ---")

                  for line in text.splitlines():
                      if "compileSdk" in line:
                          print(line)

          print("")
          print("Android configuration completed.")
          PY

      - name: Verify Android SDK configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING CONFIGURATION"
          echo "========================================"

          echo ""
          echo "Mchat app:"
          grep -Rni "compileSdk" android/app/build.gradle.kts || true

          echo ""
          echo "Agora plugin:"
          find "$HOME/.pub-cache/hosted/pub.dev" \
            -path "*/agora_rtc_engine-*/android/*" \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            ! -path "*/example/*" \
            -print \
            -exec grep -n "compileSdk" {} \; || true

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK created successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mchat-release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
