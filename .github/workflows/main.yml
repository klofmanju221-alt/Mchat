name: Build Mchat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Mchat Android SDK Configuration"
          echo "========================================"

          python3 - <<'PY'
          from pathlib import Path
          import re

          # ==========================================
          # 1. Mchat app compileSdk = 37
          # ==========================================

          app = Path("android/app/build.gradle.kts")

          if not app.exists():
              print("ERROR: android/app/build.gradle.kts not found")
              raise SystemExit(1)

          text = app.read_text()

          text = re.sub(
              r'compileSdk\s*=\s*\d+',
              'compileSdk = 37',
              text
          )

          app.write_text(text)

          print("Mchat app compileSdk = 37")

          # ==========================================
          # 2. Find Agora RTC Engine
          # ==========================================

          pub = Path.home() / ".pub-cache" / "hosted" / "pub.dev"

          agora_dirs = list(
              pub.glob("agora_rtc_engine-*/android")
          )

          if not agora_dirs:
              print("ERROR: agora_rtc_engine Android folder not found")
              raise SystemExit(1)

          print("")
          print("Agora folders found:")

          for directory in agora_dirs:
              print(" -", directory)

          # ==========================================
          # 3. Fix REAL Agora compileSdk
          # ==========================================

          for android_dir in agora_dirs:

              gradle = android_dir / "build.gradle"

              if not gradle.exists():
                  gradle = android_dir / "build.gradle.kts"

              if not gradle.exists():
                  print("ERROR: Agora Gradle file not found")
                  raise SystemExit(1)

              text = gradle.read_text()

              print("")
              print("Agora Gradle file:")
              print(gradle)

              # ------------------------------------------
              # IMPORTANT:
              # Agora 6.6.3 uses:
              #
              # compileSdkVersion safeExtGet(
              #     'compileSdkVersion',
              #     31
              # )
              #
              # Change the fallback 31 to 37.
              # ------------------------------------------

              text = re.sub(
                  r"(safeExtGet\s*\(\s*['\"]compileSdkVersion['\"]\s*,\s*)31(\s*\))",
                  r"\g<1>37\g<2>",
                  text
              )

              # Old direct syntax
              text = re.sub(
                  r'compileSdkVersion\s+31\b',
                  'compileSdkVersion 37',
                  text
              )

              # Kotlin DSL
              text = re.sub(
                  r'compileSdk\s*=\s*31\b',
                  'compileSdk = 37',
                  text
              )

              # Other syntax
              text = re.sub(
                  r'compileSdk\s+31\b',
                  'compileSdk 37',
                  text
              )

              gradle.write_text(text)

              print("")
              print("Agora compileSdk configuration after patch:")

              for line in text.splitlines():
                  if "compileSdk" in line:
                      print(line)

          print("")
          print("========================================")
          print("Android configuration completed")
          print("========================================")
          PY

      - name: Verify Android SDK configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING CONFIGURATION"
          echo "========================================"

          echo ""
          echo "Mchat app compileSdk:"
          grep -n "compileSdk" \
            android/app/build.gradle.kts || true

          echo ""
          echo "Agora compileSdk:"

          find "$HOME/.pub-cache/hosted/pub.dev" \
            -path "*/agora_rtc_engine-*/android/*" \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            ! -path "*/example/*" \
            -print \
            -exec grep -n "compileSdk" {} \; || true

          echo ""
          echo "========================================"
          echo "Verification completed"
          echo "========================================"

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESS"
          echo "========================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mchat-release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
