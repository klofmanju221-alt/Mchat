name: Mchat Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Flutter
      # --------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # --------------------------------------------------
      # 3. Flutter Pub Get
      # --------------------------------------------------
      - name: Flutter Pub Get
        run: |
          flutter --version
          flutter pub get

      # --------------------------------------------------
      # 4. Force Android compileSdk 37
      # --------------------------------------------------
      - name: Fix Android compileSdk
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")

          if p.exists():
              s = p.read_text()

              import re

              s = re.sub(
                  r'compileSdk\s*=\s*\d+',
                  'compileSdk = 37',
                  s
              )

              p.write_text(s)

              print("app compileSdk fixed to 37")
          else:
              print("android/app/build.gradle.kts not found")
          PY

      # --------------------------------------------------
      # 5. Fix Agora compileSdk
      # --------------------------------------------------
      - name: Fix Agora compileSdk
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = list(
              Path("$HOME/.pub-cache/hosted/pub.dev").glob(
                  "agora_rtc_engine-*/android/build.gradle"
              )
          )

          if not candidates:
              print("Agora build.gradle not found")
          else:
              for p in candidates:
                  s = p.read_text()

                  s = s.replace(
                      "safeExtGet('compileSdkVersion', 31)",
                      "safeExtGet('compileSdkVersion', 37)"
                  )

                  s = s.replace(
                      'safeExtGet("compileSdkVersion", 31)',
                      'safeExtGet("compileSdkVersion", 37)'
                  )

                  p.write_text(s)

                  print(f"Fixed: {p}")
          PY

      # --------------------------------------------------
      # 6. Fix iris_method_channel compileSdk
      # --------------------------------------------------
      - name: Fix iris_method_channel compileSdk
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = list(
              Path("$HOME/.pub-cache/hosted/pub.dev").glob(
                  "iris_method_channel-*/android/build.gradle"
              )
          )

          if not candidates:
              print("iris_method_channel build.gradle not found")
          else:
              for p in candidates:
                  s = p.read_text()

                  s = s.replace(
                      "safeExtGet('compileSdkVersion', 31)",
                      "safeExtGet('compileSdkVersion', 37)"
                  )

                  s = s.replace(
                      'safeExtGet("compileSdkVersion", 31)',
                      'safeExtGet("compileSdkVersion", 37)'
                  )

                  p.write_text(s)

                  print(f"Fixed: {p}")
          PY

      # --------------------------------------------------
      # 7. IMPORTANT:
      # Restore Agora special-full
      # --------------------------------------------------
      - name: Restore Agora special-full dependency
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = list(
              Path("$HOME/.pub-cache/hosted/pub.dev").glob(
                  "agora_rtc_engine-*/android/build.gradle"
              )
          )

          if not candidates:
              raise SystemExit(
                  "ERROR: Agora android/build.gradle not found"
              )

          for p in candidates:
              s = p.read_text()

              if "agora-special-full" not in s:
                  print(
                      "WARNING: agora-special-full dependency "
                      "was not found in source file."
                  )
              else:
                  print(
                      "OK: agora-special-full dependency exists."
                  )

          PY

      # --------------------------------------------------
      # 8. Verify dependency configuration
      # --------------------------------------------------
      - name: Verify Agora configuration
        shell: bash
        run: |
          echo "======================================"
          echo "Mchat Android configuration"
          echo "======================================"

          grep -n "compileSdk" android/app/build.gradle.kts || true

          echo ""
          echo "======================================"
          echo "Agora configuration"
          echo "======================================"

          find "$HOME/.pub-cache/hosted/pub.dev" \
            -path "*/agora_rtc_engine-*/android/build.gradle" \
            -print \
            -exec grep -n \
              -E "compileSdk|iris-rtc|agora-special-full|full-screen-sharing" \
              {} \; || true

          echo ""
          echo "======================================"
          echo "iris_method_channel"
          echo "======================================"

          find "$HOME/.pub-cache/hosted/pub.dev" \
            -path "*/iris_method_channel-*/android/build.gradle" \
            -print \
            -exec grep -n "compileSdk" {} \; || true

      # --------------------------------------------------
      # 9. Clean
      # --------------------------------------------------
      - name: Flutter Clean
        run: |
          flutter clean
          flutter pub get

      # --------------------------------------------------
      # 10. Build APK
      # --------------------------------------------------
      - name: Build Release APK
        run: |
          flutter build apk --release

      # --------------------------------------------------
      # 11. Verify APK
      # --------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ -f "$APK" ]; then
            echo "======================================"
            echo "APK BUILD SUCCESS"
            echo "======================================"
            ls -lh "$APK"
          else
            echo "ERROR: APK not found"
            exit 1
          fi

      # --------------------------------------------------
      # 12. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mchat-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
