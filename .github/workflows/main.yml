name: Build Mchat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Setup Flutter
      # --------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # --------------------------------------------------
      # 3. Flutter version
      # --------------------------------------------------
      - name: Flutter version
        run: flutter --version


      # --------------------------------------------------
      # 4. Get dependencies
      # --------------------------------------------------
      - name: Get dependencies
        run: flutter pub get


      # --------------------------------------------------
      # 5. Configure Android + Agora
      # --------------------------------------------------
      - name: Configure Android and Agora
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Mchat Android / Agora Configuration"
          echo "========================================"

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          # ---------------------------------------------
          # Mchat app compileSdk
          # ---------------------------------------------
          app = Path("android/app/build.gradle.kts")

          if not app.exists():
              print("ERROR: android/app/build.gradle.kts not found")
              sys.exit(1)

          text = app.read_text()

          text = re.sub(
              r'compileSdk\s*=\s*\d+',
              'compileSdk = 37',
              text
          )

          app.write_text(text)

          print("")
          print("Mchat compileSdk configured to 37")


          # ---------------------------------------------
          # Find Agora plugin
          # ---------------------------------------------
          pub = Path.home() / ".pub-cache" / "hosted" / "pub.dev"

          agora_dirs = sorted(pub.glob("agora_rtc_engine-*/android"))

          if not agora_dirs:
              print("ERROR: agora_rtc_engine Android folder not found")
              sys.exit(1)

          print("")
          print("Agora Android folders found:")

          for directory in agora_dirs:
              print(" -", directory)


          # ---------------------------------------------
          # Patch Agora Gradle dependency
          # ---------------------------------------------
          for android_dir in agora_dirs:

              gradle = android_dir / "build.gradle"

              if not gradle.exists():
                  gradle = android_dir / "build.gradle.kts"

              if not gradle.exists():
                  print("ERROR: Agora Gradle file not found:")
                  print(android_dir)
                  sys.exit(1)

              text = gradle.read_text()

              print("")
              print("----------------------------------------")
              print("Agora Gradle:")
              print(gradle)
              print("----------------------------------------")


              # -----------------------------------------
              # Force Agora compileSdk = 37
              # -----------------------------------------

              text = re.sub(
                  r"(safeExtGet\s*\(\s*['\"]compileSdkVersion['\"]\s*,\s*)31(\s*\))",
                  r"\g<1>37\g<2>",
                  text
              )

              text = re.sub(
                  r'compileSdkVersion\s+31\b',
                  'compileSdkVersion 37',
                  text
              )

              text = re.sub(
                  r'compileSdk\s*=\s*31\b',
                  'compileSdk = 37',
                  text
              )

              text = re.sub(
                  r'compileSdk\s+31\b',
                  'compileSdk 37',
                  text
              )


              # -----------------------------------------
              # IMPORTANT:
              #
              # Remove only agora-special-full.
              #
              # iris-rtc remains.
              # full-screen-sharing remains.
              #
              # This directly addresses:
              #
              # Namespace 'io.agora.rtc' is used in
              # multiple modules:
              # iris-rtc
              # agora-special-full
              # -----------------------------------------

              before = text

              text = re.sub(
                  r'^\s*api\s+[\'"]io\.agora\.rtc:agora-special-full:[^\'"]+[\'"]\s*$',
                  '',
                  text,
                  flags=re.MULTILINE
              )

              if before != text:
                  print("")
                  print("SUCCESS: Removed duplicate Agora dependency:")
                  print("        io.agora.rtc:agora-special-full")
              else:
                  print("")
                  print("WARNING: agora-special-full dependency was not found")


              gradle.write_text(text)


              # -----------------------------------------
              # Show final dependencies
              # -----------------------------------------

              print("")
              print("Final Agora dependencies:")

              for line in text.splitlines():
                  if "api " in line and "io.agora" in line:
                      print(" ", line.strip())


          print("")
          print("========================================")
          print("Android / Agora configuration completed")
          print("========================================")
          PY


      # --------------------------------------------------
      # 6. Verify configuration
      # --------------------------------------------------
      - name: Verify Android and Agora configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING CONFIGURATION"
          echo "========================================"

          echo ""
          echo "Mchat compileSdk:"
          grep -n "compileSdk" \
            android/app/build.gradle.kts || true


          echo ""
          echo "Agora Gradle configuration:"

          find "$HOME/.pub-cache/hosted/pub.dev" \
            -path "*/agora_rtc_engine-*/android/build.gradle" \
            -type f \
            ! -path "*/example/*" \
            -print \
            -exec grep -nE "compileSdk|agora-special-full|iris-rtc|full-screen-sharing" {} \; || true


          echo ""
          echo "Checking duplicate dependency..."

          if grep -R \
            "io.agora.rtc:agora-special-full" \
            "$HOME/.pub-cache/hosted/pub.dev"/agora_rtc_engine-*/android/build.gradle \
            "$HOME/.pub-cache/hosted/pub.dev"/agora_rtc_engine-*/android/build.gradle.kts \
            2>/dev/null; then

            echo ""
            echo "ERROR: agora-special-full is still present."
            exit 1

          else

            echo ""
            echo "SUCCESS: agora-special-full removed."

          fi


          echo ""
          echo "========================================"
          echo "Configuration verification completed"
          echo "========================================"


      # --------------------------------------------------
      # 7. Clean Flutter
      # --------------------------------------------------
      - name: Flutter clean
        run: flutter clean


      # --------------------------------------------------
      # 8. Get dependencies again
      # --------------------------------------------------
      - name: Flutter pub get
        run: flutter pub get


      # --------------------------------------------------
      # 9. Build APK
      # --------------------------------------------------
      - name: Build APK
        run: flutter build apk --release


      # --------------------------------------------------
      # 10. Verify APK
      # --------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo ""
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESS"
          echo "========================================"

          ls -lh "$APK"


      # --------------------------------------------------
      # 11. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mchat-release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
