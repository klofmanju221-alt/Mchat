name: Build Mchat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Setup Flutter
      # --------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # --------------------------------------------------
      # 3. Flutter version
      # --------------------------------------------------
      - name: Flutter version
        run: flutter --version


      # --------------------------------------------------
      # 4. Get dependencies
      # --------------------------------------------------
      - name: Get dependencies
        run: flutter pub get


      # --------------------------------------------------
      # 5. Configure Android, Agora and Iris
      # --------------------------------------------------
      - name: Configure Android, Agora and Iris
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Mchat Android Configuration"
          echo "========================================"

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          pub = Path.home() / ".pub-cache" / "hosted" / "pub.dev"


          # ==================================================
          # MCHAT APP
          # ==================================================

          app = Path("android/app/build.gradle.kts")

          if not app.exists():
              print("ERROR: android/app/build.gradle.kts not found")
              sys.exit(1)

          text = app.read_text()

          text = re.sub(
              r'compileSdk\s*=\s*\d+',
              'compileSdk = 37',
              text
          )

          app.write_text(text)

          print("")
          print("SUCCESS: Mchat compileSdk = 37")


          # ==================================================
          # AGORA RTC ENGINE
          # ==================================================

          agora_dirs = sorted(
              pub.glob("agora_rtc_engine-*/android")
          )

          if not agora_dirs:
              print("ERROR: agora_rtc_engine Android folder not found")
              sys.exit(1)

          print("")
          print("Agora folders:")

          for android_dir in agora_dirs:

              print(" -", android_dir)

              gradle = android_dir / "build.gradle"

              if not gradle.exists():
                  gradle = android_dir / "build.gradle.kts"

              if not gradle.exists():
                  print("ERROR: Agora Gradle file not found")
                  sys.exit(1)

              text = gradle.read_text()


              # ----------------------------------------------
              # Agora compileSdk -> 37
              # ----------------------------------------------

              text = re.sub(
                  r"(safeExtGet\s*\(\s*['\"]compileSdkVersion['\"]\s*,\s*)\d+(\s*\))",
                  r"\g<1>37\g<2>",
                  text
              )

              text = re.sub(
                  r'compileSdkVersion\s+\d+',
                  'compileSdkVersion 37',
                  text
              )

              text = re.sub(
                  r'compileSdk\s*=\s*\d+',
                  'compileSdk = 37',
                  text
              )

              text = re.sub(
                  r'compileSdk\s+\d+',
                  'compileSdk 37',
                  text
              )


              # ----------------------------------------------
              # Remove duplicate Agora dependency
              # ----------------------------------------------

              text = re.sub(
                  r'^\s*api\s+[\'"]io\.agora\.rtc:agora-special-full:[^\'"]+[\'"]\s*$',
                  '',
                  text,
                  flags=re.MULTILINE
              )

              gradle.write_text(text)

              print("SUCCESS: Agora compileSdk = 37")
              print("SUCCESS: Agora duplicate dependency handled")


          # ==================================================
          # IRIS METHOD CHANNEL
          # ==================================================

          iris_dirs = sorted(
              pub.glob("iris_method_channel-*/android")
          )

          if not iris_dirs:
              print(
                  "ERROR: iris_method_channel Android folder not found"
              )
              sys.exit(1)

          print("")
          print("Iris Method Channel folders:")

          for android_dir in iris_dirs:

              print(" -", android_dir)

              gradle = android_dir / "build.gradle"

              if not gradle.exists():
                  gradle = android_dir / "build.gradle.kts"

              if not gradle.exists():
                  print(
                      "ERROR: iris_method_channel Gradle file not found"
                  )
                  sys.exit(1)

              text = gradle.read_text()


              # ----------------------------------------------
              # Iris compileSdk -> 37
              # ----------------------------------------------

              text = re.sub(
                  r"(safeExtGet\s*\(\s*['\"]compileSdkVersion['\"]\s*,\s*)\d+(\s*\))",
                  r"\g<1>37\g<2>",
                  text
              )

              text = re.sub(
                  r'compileSdkVersion\s+\d+',
                  'compileSdkVersion 37',
                  text
              )

              text = re.sub(
                  r'compileSdk\s*=\s*\d+',
                  'compileSdk = 37',
                  text
              )

              text = re.sub(
                  r'compileSdk\s+\d+',
                  'compileSdk 37',
                  text
              )

              gradle.write_text(text)

              print(
                  "SUCCESS: iris_method_channel "
                  "compileSdk configured for 37"
              )


          print("")
          print("========================================")
          print("Android configuration completed")
          print("========================================")
          PY


      # --------------------------------------------------
      # 6. Verify configuration
      # --------------------------------------------------
      - name: Verify configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING CONFIGURATION"
          echo "========================================"


          echo ""
          echo "Mchat compileSdk:"
          grep -n "compileSdk" \
            android/app/build.gradle.kts || true


          # ==================================================
          # VERIFY AGORA
          # ==================================================

          echo ""
          echo "Agora configuration:"

          AGORA_FILE=$(find \
            "$HOME/.pub-cache/hosted/pub.dev" \
            -path "*/agora_rtc_engine-*/android/build.gradle" \
            -type f \
            ! -path "*/example/*" \
            | head -n 1)

          if [ -z "$AGORA_FILE" ]; then
            echo "ERROR: Agora Gradle file not found."
            exit 1
          fi

          cat "$AGORA_FILE"


          echo ""
          echo "Checking Agora compileSdk..."

          if grep -qE \
            "compileSdkVersion 37|compileSdk = 37|compileSdk 37|safeExtGet\\('compileSdkVersion', 37\\)|safeExtGet\\(\"compileSdkVersion\", 37\\)" \
            "$AGORA_FILE"; then

            echo "SUCCESS: Agora compileSdk is configured for 37."

          else

            echo "ERROR: Agora compileSdk 37 configuration not found."
            exit 1

          fi


          echo ""
          echo "Checking duplicate Agora dependency..."

          if grep -q \
            "io.agora.rtc:agora-special-full" \
            "$AGORA_FILE"; then

            echo "ERROR: agora-special-full is still present."
            exit 1

          else

            echo "SUCCESS: agora-special-full removed."

          fi


          # ==================================================
          # VERIFY IRIS
          # ==================================================

          echo ""
          echo "Iris Method Channel configuration:"

          IRIS_FILE=$(find \
            "$HOME/.pub-cache/hosted/pub.dev" \
            -path "*/iris_method_channel-*/android/build.gradle" \
            -type f \
            ! -path "*/example/*" \
            | head -n 1)

          if [ -z "$IRIS_FILE" ]; then
            echo "ERROR: Iris Gradle file not found."
            exit 1
          fi

          cat "$IRIS_FILE"


          echo ""
          echo "Checking Iris compileSdk..."

          if grep -qE \
            "compileSdkVersion 37|compileSdk = 37|compileSdk 37|safeExtGet\\('compileSdkVersion', 37\\)|safeExtGet\\(\"compileSdkVersion\", 37\\)" \
            "$IRIS_FILE"; then

            echo "SUCCESS: iris_method_channel compileSdk is configured for 37."

          else

            echo "ERROR: iris_method_channel compileSdk 37 configuration not found."
            exit 1

          fi


          echo ""
          echo "========================================"
          echo "ALL CONFIGURATION CHECKS PASSED"
          echo "========================================"


      # --------------------------------------------------
      # 7. Flutter clean
      # --------------------------------------------------
      - name: Flutter clean
        run: flutter clean


      # --------------------------------------------------
      # 8. Pub get
      # --------------------------------------------------
      - name: Flutter pub get
        run: flutter pub get


      # --------------------------------------------------
      # 9. Build APK
      # --------------------------------------------------
      - name: Build APK
        run: flutter build apk --release


      # --------------------------------------------------
      # 10. Verify APK
      # --------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo ""
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESS"
          echo "========================================"

          ls -lh "$APK"


      # --------------------------------------------------
      # 11. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mchat-release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
