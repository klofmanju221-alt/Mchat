name: Mchat Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Pub Get
        run: |
          flutter --version
          flutter pub get

      - name: Fix Android compileSdk
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")

          if p.exists():
              s = p.read_text()

              s = re.sub(
                  r'compileSdk\s*=\s*\d+',
                  'compileSdk = 37',
                  s
              )

              p.write_text(s)
              print("OK: app compileSdk = 37")
          else:
              raise SystemExit(
                  "ERROR: android/app/build.gradle.kts not found"
              )
          PY

      - name: Fix Agora compileSdk
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          home = Path.home()

          candidates = list(
              (home / ".pub-cache/hosted/pub.dev").glob(
                  "agora_rtc_engine-*/android/build.gradle"
              )
          )

          if not candidates:
              raise SystemExit(
                  "ERROR: Agora android/build.gradle not found"
              )

          for p in candidates:
              s = p.read_text()

              s = s.replace(
                  "safeExtGet('compileSdkVersion', 31)",
                  "safeExtGet('compileSdkVersion', 37)"
              )

              s = s.replace(
                  'safeExtGet("compileSdkVersion", 31)',
                  'safeExtGet("compileSdkVersion", 37)'
              )

              p.write_text(s)

              print(f"OK: Agora compileSdk fixed: {p}")
          PY

      - name: Fix iris_method_channel compileSdk
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          home = Path.home()

          candidates = list(
              (home / ".pub-cache/hosted/pub.dev").glob(
                  "iris_method_channel-*/android/build.gradle"
              )
          )

          if not candidates:
              print(
                  "WARNING: iris_method_channel build.gradle not found"
              )
          else:
              for p in candidates:
                  s = p.read_text()

                  s = s.replace(
                      "safeExtGet('compileSdkVersion', 31)",
                      "safeExtGet('compileSdkVersion', 37)"
                  )

                  s = s.replace(
                      'safeExtGet("compileSdkVersion", 31)',
                      'safeExtGet("compileSdkVersion", 37)'
                  )

                  p.write_text(s)

                  print(
                      f"OK: iris_method_channel compileSdk fixed: {p}"
                  )
          PY

      - name: Verify Agora dependencies
        shell: bash
        run: |
          echo "======================================"
          echo "AGORA CONFIGURATION"
          echo "======================================"

          HOME_DIR="$HOME"

          find "$HOME_DIR/.pub-cache/hosted/pub.dev" \
            -path "*/agora_rtc_engine-*/android/build.gradle" \
            -print \
            -exec grep -n \
            -E "compileSdk|iris-rtc|agora-special-full|full-screen-sharing" \
            {} \;

          echo ""
          echo "======================================"
          echo "IRIS METHOD CHANNEL"
          echo "======================================"

          find "$HOME_DIR/.pub-cache/hosted/pub.dev" \
            -path "*/iris_method_channel-*/android/build.gradle" \
            -print \
            -exec grep -n "compileSdk" {} \;

      - name: Flutter Clean
        run: |
          flutter clean
          flutter pub get

      - name: Build Release APK
        run: |
          flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ -f "$APK" ]; then
            echo "======================================"
            echo "APK BUILD SUCCESS"
            echo "======================================"
            ls -lh "$APK"
          else
            echo "ERROR: APK not found"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mchat-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
